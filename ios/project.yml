name: PersonalizedNotes
options:
  bundleIdPrefix: com.handwrittennotes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: false
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
packages:
  PersonalizedNotes:
    path: .
targets:
  PersonalizedNotes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/PersonalizedNotesApp
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.handwrittennotes.digitizer
        PRODUCT_NAME: PersonalizedNotes
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: Sources/PersonalizedNotesApp/PersonalizedNotes.entitlements
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: Sources/PersonalizedNotesApp/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Personalized Notes
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.handwrittennotes.notebook
            UTTypeDescription: Personalized Notes Notebook
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - hndnote
        CFBundleDocumentTypes:
          - CFBundleTypeName: Personalized Notes Notebook
            CFBundleTypeRole: Editor
            LSItemContentTypes:
              - com.handwrittennotes.notebook
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.handwrittennotes.digitizer.refresh
        NSPhotoLibraryUsageDescription: Personalized Notes can import photos you explicitly share into a notebook. The camera is not used.
        NSLocalNetworkUsageDescription: Personalized Notes connects to your configured notes server on your local network for sign-in and sync.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: Sources/PersonalizedNotesApp/PersonalizedNotes.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.handwrittennotes.digitizer
    dependencies:
      - package: PersonalizedNotes
        product: PersonalizedNotesKit
      - package: PersonalizedNotes
        product: ShareInbox
      - sdk: SwiftUI.framework
      - sdk: PencilKit.framework
      - sdk: UIKit.framework
      - target: ShareExtension
        embed: true
        codeSign: true
    scheme:
      testTargets:
        - PersonalizedNotesTests
        - PersonalizedNotesUITests

  PersonalizedNotesUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.handwrittennotes.digitizer.uitests
        PRODUCT_NAME: PersonalizedNotesUITests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PersonalizedNotes
    dependencies:
      - target: PersonalizedNotes

  PersonalizedNotesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/PersonalizedNotesAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.handwrittennotes.digitizer.tests
        PRODUCT_NAME: PersonalizedNotesTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PersonalizedNotes
    dependencies:
      - target: PersonalizedNotes

  ShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ShareExtension
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.handwrittennotes.digitizer.share
        PRODUCT_NAME: ShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/ShareExtension/ShareExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    entitlements:
      path: Sources/ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.handwrittennotes.digitizer
    dependencies:
      - sdk: UIKit.framework
      - sdk: UniformTypeIdentifiers.framework

schemes:
  PersonalizedNotes:
    build:
      targets:
        PersonalizedNotes: all
        ShareExtension: all
    run:
      config: Debug
    archive:
      config: Release

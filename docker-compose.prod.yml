# docker-compose.prod.yml — optional production-shaped profile
#
# This file is NOT the default. One-command local/demo remains:
#   docker compose up
# which uses docker-compose.yml (SQLite + filesystem object store).
#
# Production-shaped stack (Postgres, Redis, SeaweedFS, backend, frontend):
#   docker compose -f docker-compose.prod.yml up --build
#
# Volumes:
#   postgres_data  — PostgreSQL 16 cluster (HND_DATABASE_URL)
#   redis_data     — Redis 7 RDB/AOF directory (HND_REDIS_URL)
#   seaweed_data — SeaweedFS object bytes and metadata
#
# Healthchecks:
#   postgres  pg_isready
#   redis     redis-cli ping
#   seaweedfs GET /cluster/status on the internal master
#   backend   GET /health
#   frontend  wget /
#
# Required secrets have no defaults in this file. Compose refuses to start
# unless HND_POSTGRES_PASSWORD, HND_S3_ADMIN_ACCESS_KEY, HND_S3_ADMIN_SECRET_KEY, HND_S3_ENCRYPTION_KEY,
# HND_S3_ACCESS_KEY, and HND_S3_SECRET_KEY are set. TLS, backups, and trained
# model artifacts are still required (see docs/PRODUCTION_PROFILE.md).

volumes:
  postgres_data:
  redis_data:
  seaweed_data:
  seaweed_config:

networks:
  storage:
    internal: true

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${HND_POSTGRES_USER:-hnd}"
      POSTGRES_PASSWORD: "${HND_POSTGRES_PASSWORD:?must be set}"
      POSTGRES_DB: "${HND_POSTGRES_DB:-hnd}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HND_POSTGRES_USER:-hnd} -d ${HND_POSTGRES_DB:-hnd}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  storage-config:
    image: python:3.11-slim
    network_mode: none
    environment:
      HND_S3_BUCKET: "${HND_S3_BUCKET:-hnd-objects}"
      HND_S3_ADMIN_ACCESS_KEY: "${HND_S3_ADMIN_ACCESS_KEY:?must be set}"
      HND_S3_ADMIN_SECRET_KEY: "${HND_S3_ADMIN_SECRET_KEY:?must be set}"
      HND_S3_ENCRYPTION_KEY: "${HND_S3_ENCRYPTION_KEY:?must be set and retained for encrypted data}"
      HND_S3_ACCESS_KEY: "${HND_S3_ACCESS_KEY:?must be set}"
      HND_S3_SECRET_KEY: "${HND_S3_SECRET_KEY:?must be set}"
    command: ["python", "/configure.py"]
    volumes:
      - ./deploy/seaweedfs/configure.py:/configure.py:ro
      - seaweed_config:/config

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    networks: [storage]
    depends_on:
      storage-config:
        condition: service_completed_successfully
    command: ["mini", "-dir=/data", "-ip=seaweedfs", "-s3.config=/config/s3.json", "-webdav=false", "-admin.ui=false", "-s3.port.iceberg=0", "-s3.port.lance=0"]
    environment:
      S3_BUCKET: "${HND_S3_BUCKET:-hnd-objects}"
      WEED_S3_SSE_KEY: "${HND_S3_ENCRYPTION_KEY:?must be set and retained for encrypted data}"
    volumes:
      - seaweed_data:/data
      - seaweed_config:/config:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  storage-init:
    image: handwritten-notes-digitizer-backend-prod
    networks: [storage]
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      HND_S3_BUCKET: "${HND_S3_BUCKET:-hnd-objects}"
      HND_S3_REGION: "${HND_S3_REGION:-us-east-1}"
      HND_S3_ADMIN_ACCESS_KEY: "${HND_S3_ADMIN_ACCESS_KEY:?must be set}"
      HND_S3_ADMIN_SECRET_KEY: "${HND_S3_ADMIN_SECRET_KEY:?must be set}"
    command: ["python", "/initialize.py"]
    volumes:
      - ./deploy/seaweedfs/initialize.py:/initialize.py:ro

  backend:
    image: handwritten-notes-digitizer-backend-prod
    build:
      context: .
      dockerfile: Dockerfile.backend.prod
    restart: unless-stopped
    networks: [default, storage]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      HND_ENVIRONMENT: "${HND_ENVIRONMENT:-production}"
      HND_ENABLE_METRICS: "${HND_ENABLE_METRICS:-true}"
      HND_RANDOM_SEED: "${HND_RANDOM_SEED:-1337}"
      HND_DETERMINISTIC: "${HND_DETERMINISTIC:-true}"

      HND_DATABASE_URL: "postgresql+psycopg://${HND_POSTGRES_USER:-hnd}:${HND_POSTGRES_PASSWORD}@postgres:5432/${HND_POSTGRES_DB:-hnd}"
      HND_REDIS_URL: "${HND_REDIS_URL:-redis://redis:6379/0}"

      HND_OBJECT_STORE_BACKEND: "${HND_OBJECT_STORE_BACKEND:-s3}"
      HND_OBJECT_STORE_PATH: "${HND_OBJECT_STORE_PATH:-/app/var/objectstore}"
      HND_S3_ENDPOINT_URL: "${HND_S3_ENDPOINT_URL:-http://seaweedfs:8333}"
      HND_S3_REGION: "${HND_S3_REGION:-us-east-1}"
      HND_S3_BUCKET: "${HND_S3_BUCKET:-hnd-objects}"
      HND_S3_ACCESS_KEY: "${HND_S3_ACCESS_KEY:?must be set}"
      HND_S3_SECRET_KEY: "${HND_S3_SECRET_KEY:?must be set}"
      HND_S3_PREFIX: "${HND_S3_PREFIX:-}"
      HND_OTEL_EXPORTER_OTLP_ENDPOINT: "${HND_OTEL_EXPORTER_OTLP_ENDPOINT:-}"

      HND_MAX_UPLOAD_BYTES: "${HND_MAX_UPLOAD_BYTES:-10485760}"
      HND_RECOGNITION_TIMEOUT_SECONDS: "${HND_RECOGNITION_TIMEOUT_SECONDS:-10.0}"
      HND_PDF_RASTER_DPI: "${HND_PDF_RASTER_DPI:-200}"
      HND_PDF_MAX_PAGES: "${HND_PDF_MAX_PAGES:-50}"
      HND_PDF_MAX_PIXELS: "${HND_PDF_MAX_PIXELS:-40000000}"
      HND_FORMULA_ENGINE: "${HND_FORMULA_ENGINE:-auto}"

      HND_PERSONALIZATION_TRIGGER_THRESHOLD: "${HND_PERSONALIZATION_TRIGGER_THRESHOLD:-20}"
      HND_HELD_OUT_FRACTION: "${HND_HELD_OUT_FRACTION:-0.2}"
      HND_HELD_OUT_MIN_PAIRS: "${HND_HELD_OUT_MIN_PAIRS:-5}"
      HND_MAX_TRAINING_EPOCHS: "${HND_MAX_TRAINING_EPOCHS:-50}"
      HND_ALLOW_SYNTHETIC_EVAL: "${HND_ALLOW_SYNTHETIC_EVAL:-false}"

      HND_STORAGE_AVAILABLE: "${HND_STORAGE_AVAILABLE:-true}"
      HND_HTR_ENGINE_AVAILABLE: "${HND_HTR_ENGINE_AVAILABLE:-true}"
      HND_TRAINING_WORKER_AVAILABLE: "${HND_TRAINING_WORKER_AVAILABLE:-true}"
    volumes:
      # Trained model artifacts remain a host bind-mount; S3 stores user objects.
      - ./backend/var/objectstore/models:/app/var/objectstore/models:ro
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # worker:
  #   Optional isolated recognition/training worker. Not wired yet — the API
  #   process still runs in-process job threads. When a worker entrypoint exists,
  #   it must use the same required secrets as the backend service above
  #   (HND_DATABASE_URL, HND_S3_ACCESS_KEY, HND_S3_SECRET_KEY, and the rest of
  #   that service's environment). Do not hardcode passwords in this file.
  #   Consider setting HND_TRAINING_WORKER_AVAILABLE=false on the API replica
  #   so training is not duplicated.
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.backend.prod
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     storage-init:
  #       condition: service_completed_successfully
  #   environment:
  #     # Same required environment as the backend service. No literal passwords.

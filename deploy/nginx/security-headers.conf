# Security response headers.
#
# Include this snippet at server level, and again in every location that
# declares its own add_header. nginx does not inherit add_header into such a
# location, so a lone Cache-Control header would drop the rest.
# Every directive uses "always" so error responses keep the headers too.

# Prevent framing by other origins (clickjacking protection).
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME-type sniffing (forces browser to respect Content-Type).
add_header X-Content-Type-Options "nosniff" always;

# Restrict referrer information to same-origin only.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content-Security-Policy:
# - default-src 'self'         — all resource types default to same-origin
# - script-src 'self'          — no inline scripts, no eval
# - style-src 'self' 'unsafe-inline' — Vite inlines some styles at build time
# - img-src 'self' data: blob: — canvas/blob image previews need blob:
# - connect-src 'self'         — fetch/XHR only to same origin
# - font-src 'self'            — web fonts from same origin
# - object-src 'none'          — no Flash/plugins
# - frame-ancestors 'none'     — additional framing protection
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none';" always;

# The upload UI offers an in-browser camera capture. Keep it same-origin
# only; microphone and geolocation remain disabled.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

# Browsers honor this only on HTTPS responses. Terminate TLS in front of the
# HTTP listener before exposing it to browsers.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header Cross-Origin-Opener-Policy "same-origin" always;

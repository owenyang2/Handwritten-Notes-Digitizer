# nginx.conf — reverse-proxy + static-file server for the frontend container
#
# Serves the Vite-built static assets and proxies /api/* requests to the
# backend service so both are reachable from a single origin (port 80),
# which lets the frontend use relative URLs without CORS.
#
# Security headers live in /etc/nginx/security-headers.conf. That snippet is
# included at server level and again in the static-asset location, because a
# location that declares add_header (Cache-Control) does not inherit the
# server headers. The CSP allows 'self' for all resource types and restricts
# scripts to same-origin only.

server {
    listen 80;
    server_name _;

    # Hide nginx version from the Server response header.
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    # Serve the compiled frontend bundle from /usr/share/nginx/html.
    root /usr/share/nginx/html;
    index index.html;

    # ── Static assets ──────────────────────────────────────────────────────
    # Vite outputs hashed filenames; long cache TTL for assets, no-cache for
    # the HTML entry point so updates are picked up immediately.
    location ~* \.(js|css|woff2?|ttf|svg|png|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # ── Operational routes (not public) ────────────────────────────────────
    # Exact match is placed next to the API proxy. /api/health stays public.
    location = /api/metrics {
        deny all;
        return 403;
    }
    location = /api/health/details {
        deny all;
        return 403;
    }
    location = /api/docs { deny all; return 403; }
    location = /api/redoc { deny all; return 403; }
    location = /api/openapi.json { deny all; return 403; }

    # ── Backend API proxy ──────────────────────────────────────────────────
    # All requests that start with /api/ are forwarded to the backend service.
    # The /api/ prefix is stripped so backend routes remain unprefixed
    # (e.g. /api/health → /health).
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Allow the 10 MiB decoded upload plus the 1 MiB multipart/request
        # envelope enforced by backend/app/middleware/request_limits.py.
        # If HND_MAX_UPLOAD_BYTES is changed, update this proxy budget too.
        client_max_body_size 11m;
        # Streaming responses (e.g. SSE) need these headers cleared.
        proxy_set_header   Connection "";
        proxy_buffering    off;
        # Do not forward the nginx Server header to clients via the proxy.
        proxy_hide_header  Server;
    }

    # ── SPA fallback ───────────────────────────────────────────────────────
    # All other paths are served the SPA entry point so client-side routing
    # works on full-page reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

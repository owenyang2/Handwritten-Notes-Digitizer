# nginx.conf — reverse-proxy + static-file server for the frontend container
#
# Serves the Vite-built static assets and proxies /api/* requests to the
# backend service so both are reachable from a single origin (port 80),
# which lets the frontend use relative URLs without CORS.
#
# Security headers are applied globally here so every response (static assets,
# API proxy, and SPA fallback) carries the hardened set. The CSP allows
# 'self' for all resource types and restricts scripts to same-origin only.

server {
    listen 80;
    server_name _;

    # ── Security hardening ─────────────────────────────────────────────────
    # Hide nginx version from Server response header.
    server_tokens off;

    # Prevent framing by other origins (clickjacking protection).
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME-type sniffing (forces browser to respect Content-Type).
    add_header X-Content-Type-Options "nosniff" always;

    # Restrict referrer information to same-origin only.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy:
    # - default-src 'self'         — all resource types default to same-origin
    # - script-src 'self'          — no inline scripts, no eval
    # - style-src 'self' 'unsafe-inline' — Vite inlines some styles at build time
    # - img-src 'self' data: blob: — canvas/blob image previews need blob:
    # - connect-src 'self'         — fetch/XHR only to same origin
    # - font-src 'self'            — web fonts from same origin
    # - object-src 'none'          — no Flash/plugins
    # - frame-ancestors 'none'     — additional framing protection
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none';"
        always;

    # Permissions-Policy: disable unused browser features.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Serve the compiled frontend bundle from /usr/share/nginx/html.
    root /usr/share/nginx/html;
    index index.html;

    # ── Static assets ──────────────────────────────────────────────────────
    # Vite outputs hashed filenames; long cache TTL for assets, no-cache for
    # the HTML entry point so updates are picked up immediately.
    location ~* \.(js|css|woff2?|ttf|svg|png|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Backend API proxy ──────────────────────────────────────────────────
    # All requests that start with /api/ are forwarded to the backend service.
    # The /api/ prefix is stripped so backend routes remain unprefixed
    # (e.g. /api/health → /health).
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Allow large image uploads (matches HND_MAX_UPLOAD_BYTES = 10 MB).
        client_max_body_size 11m;
        # Streaming responses (e.g. SSE) need these headers cleared.
        proxy_set_header   Connection "";
        proxy_buffering    off;
        # Do not forward the nginx Server header to clients via the proxy.
        proxy_hide_header  Server;
    }

    # ── SPA fallback ───────────────────────────────────────────────────────
    # All other paths are served the SPA entry point so client-side routing
    # works on full-page reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
